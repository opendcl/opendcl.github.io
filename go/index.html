<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDCL redirect</title>
  <!-- No-JS / failed-JS only: HTML landing page — never a direct .msi URL (avoids double downloads). -->
  <meta http-equiv="refresh" content="5;url=../download/">
  <script src="../assets/versions.js"></script>
  <script>
  (function () {
    var V = window.OPENDCL_VERSIONS || {
      stable: '9.1.5.2',
      current: '9.3.3.1',
      releaseDownloadBase: 'https://github.com/opendcl/OpenDCL/releases/download'
    };
    var ARCHIVE = 'https://www.opendcl.com/forum-archive';
    var DISCUSSIONS = 'https://github.com/opendcl/community/discussions';
    var ISSUES = 'https://github.com/opendcl/OpenDCL/issues';
    var HELP = '../HelpFiles/';
    var DOWNLOAD = '../download/';

    function releaseUrl(filename, version) {
      return V.releaseDownloadBase + '/v' + version + '/' + filename;
    }
    function studio(lang, dev) {
      var ver = dev ? V.current : V.stable;
      return releaseUrl('OpenDCL.Studio.' + lang.toUpperCase() + '.' + ver + '.msi', ver);
    }
    function runtime(dev, msm) {
      var ver = dev ? V.current : V.stable;
      var ext = msm ? 'msm' : 'msi';
      return releaseUrl('OpenDCL.Runtime.' + ver + '.' + ext, ver);
    }

    // Token-based resolution (order-independent). Matches historical go?studio&enu&dev etc.
    function resolve(qs) {
      qs = (qs || '').replace(/^\?/, '').toLowerCase().replace(/&amp;/g, '&');
      if (!qs) return DOWNLOAD;

      var tokens = qs.split('&').map(function (t) {
        return t.replace(/^\s+|\s+$/g, '');
      }).filter(function (t) { return t.length > 0; });

      function has(name) {
        return tokens.indexOf(name) >= 0;
      }

      // Studio installers
      if (has('studio')) {
        var lang = 'enu';
        var langs = ['enu', 'deu', 'chs', 'cht', 'fra', 'esm', 'rus'];
        for (var i = 0; i < langs.length; i++) {
          if (has(langs[i])) { lang = langs[i]; break; }
        }
        return studio(lang, has('dev'));
      }

      // Runtime
      if (has('runtime')) {
        return runtime(has('dev'), has('msm'));
      }

      // Forum → archive / discussions
      if (has('forum')) {
        if (has('post')) return DISCUSSIONS;
        if (has('de')) return ARCHIVE + '/b/11.html';
        if (has('fr')) return ARCHIVE + '/b/10.html';
        if (has('cn')) return ARCHIVE + '/b/12.html';
        if (has('ru')) return ARCHIVE + '/b/14.html';
        if (has('es')) return ARCHIVE + '/b/16.html';
        return '../forum/';
      }

      // Help
      if (has('help')) {
        if (has('de')) return HELP + 'DEU/';
        if (has('ru')) return HELP + 'RUS/';
        if (has('en') || has('fr') || has('cn') || has('es')) return HELP + 'ENU/';
        return HELP;
      }

      // Tutorials / migration guides
      if (has('tutorials') || has('downloads')) return DOWNLOAD;

      // Project / tracker → GitHub
      if (has('ossproject')) return 'https://github.com/opendcl/OpenDCL';
      if (has('bugreport')) return has('new') ? (ISSUES + '/new') : ISSUES;
      if (has('wishlist')) return DISCUSSIONS;

      return DOWNLOAD;
    }

    var target = resolve(window.location.search || '');

    // Prefer replace so Back does not return to this shim.
    // Meta refresh stays on ../download/ only — never retarget to MSI/GitHub assets
    // (file downloads often leave this page open, which would trigger a second download).
    try {
      window.location.replace(target);
    } catch (e) {
      window.location.href = target;
    }

    try {
      document.addEventListener('DOMContentLoaded', function () {
        var a = document.getElementById('go-target');
        if (a) {
          a.href = target;
          a.textContent = 'continue';
        }
      });
    } catch (e2) { /* ignore */ }
  })();
  </script>
</head>
<body>
  <p>Redirecting… If nothing happens, open the
    <a id="go-target" href="../download/">download page</a>
    (or wait a few seconds).
  </p>
  <noscript>
    <p>JavaScript is required for short <code>/go?…</code> links.
      Continue to the <a href="../download/">download page</a>.</p>
  </noscript>
</body>
</html>
