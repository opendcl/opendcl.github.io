<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — OpenDCL</title>
  <script>
  (function () {
    // Map common legacy paths that miss a static file (trailing slash, old CMS, etc.)
    // Important: do not keep a real forum/index.php on GitHub Pages — it is served as
    // application/x-httpd-php and browsers will not run the JS redirect. Missing
    // /forum/index.php?topic=… hits this 404 with the original URL preserved.
    var path = (location.pathname || '').replace(/\/+$/, '') || '/';
    var search = location.search || '';
    var lower = path.toLowerCase();
    var full = (lower + (search || '')).toLowerCase();

    var ARCHIVE = 'https://www.opendcl.com/forum-archive';

    function go(url) {
      location.replace(url);
    }

    function firstId(value) {
      if (value == null || value === '') return null;
      var m = String(value).match(/(\d+)/);
      return m ? m[1] : null;
    }

    function forumRedirect() {
      try {
        var params = new URLSearchParams(search || '');
        var topicId = firstId(params.get('topic'));
        var boardId = firstId(params.get('board'));
        // SMF path-info style: /forum/index.php/topic,56.0 or .../board,2.0
        if (!topicId) {
          var tm = full.match(/topic[=,](\d+)/);
          if (tm) topicId = tm[1];
        }
        if (!boardId) {
          var bm = full.match(/board[=,](\d+)/);
          if (bm) boardId = bm[1];
        }
        if (topicId) {
          go(ARCHIVE + '/t/' + topicId + '.html');
          return true;
        }
        if (boardId) {
          go(ARCHIVE + '/b/' + boardId + '.html');
          return true;
        }
      } catch (e) {
        // Fall through.
      }
      return false;
    }

    // /forum/index.php?topic=N (and other missing forum paths) → archive or landing
    if (lower.indexOf('/forum') === 0) {
      if (forumRedirect()) return;
      go('/forum/' + search + location.hash);
      return;
    }
    if (lower.indexOf('/go') === 0) {
      go('/go/' + search + location.hash);
      return;
    }
    if (lower.indexOf('/download') === 0) {
      go('/download/');
      return;
    }
    if (lower.indexOf('/helpfiles') === 0) {
      go('/HelpFiles/');
      return;
    }
    if (lower.indexOf('/localization') === 0) {
      go('/localization/');
      return;
    }
    if (lower.indexOf('/wordpress') === 0) {
      go('/wordpress/');
      return;
    }
    if (lower.indexOf('/donate') === 0) {
      go('/donate/');
      return;
    }
    if (lower.indexOf('/tutorials') === 0) {
      go('/download/');
      return;
    }
  })();
  </script>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main style="max-width:40rem;margin:3rem auto;padding:0 1rem;font:18px/1.5 system-ui,sans-serif">
    <h1>Page not found</h1>
    <p>That URL is not on the new OpenDCL site. Try:</p>
    <ul>
      <li><a href="/">Project home</a></li>
      <li><a href="/download/">Download</a></li>
      <li><a href="/HelpFiles/">Help</a></li>
      <li><a href="/forum/">Forum (archive + Discussions)</a></li>
      <li><a href="https://www.opendcl.com/forum-archive/">Forum archive search</a></li>
      <li><a href="https://github.com/opendcl/community/discussions">GitHub Discussions</a></li>
    </ul>
  </main>
</body>
</html>
